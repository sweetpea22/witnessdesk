# CANDIDATE ONLY: copy to the PRIVATE localpoast repo's .github/workflows/.
# Manual dispatch builds and publishes the private application image.
name: Build private localpoast image
run-name: Build private image ${{ inputs.version }}
"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Image version, for example v0.0.1"
        type: string
        required: true
concurrency:
  group: private-localpoast-image-${{ inputs.version }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout private source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Guard private repository and package
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          OWNER_TYPE="$(gh api "repos/$GITHUB_REPOSITORY" --jq .owner.type)"
          if [ "$OWNER_TYPE" = Organization ]; then PREFIX=orgs; else PREFIX=users; fi
          PACKAGE_ROUTE="$PREFIX/$OWNER/packages/container/localpoast"
          if VISIBILITY="$(gh api "$PACKAGE_ROUTE" --jq .visibility 2>"$RUNNER_TEMP/localpoast-package-check")"; then
            test "$VISIBILITY" = private
          else
            # New GHCR packages default to private. Other failures must stop.
            grep -q 'HTTP 404' "$RUNNER_TEMP/localpoast-package-check"
          fi
          echo "name=ghcr.io/$OWNER/localpoast" >> "$GITHUB_OUTPUT"
          echo "route=$PACKAGE_ROUTE" >> "$GITHUB_OUTPUT"
      - name: Set up AMD64 builder
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Authenticate GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push private AMD64 image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Confirm visibility and report pinned digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_ROUTE: ${{ steps.image.outputs.route }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test "$(gh api "$PACKAGE_ROUTE" --jq .visibility)" = private
          printf 'Private AMD64 image: %s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
